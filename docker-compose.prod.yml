version: '3.8'
services:
  web_app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=https://coreapi.ldhuy.name.vn
    container_name: sale_manager_app
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://coreapi.ldhuy.name.vn
      - NEXTAUTH_SECRET=DafaSecureSecret123!@#
      - NEXTAUTH_URL=https://sale.ldhuy.name.vn
    ports:
      - "3001:3000"
    networks:
      - app_network
networks:
  app_network:
    external: true
